; Vitals HUD - every value can be changed in game: SKSE Menu Framework (F1) -> Vitals HUD

[Panel]
bEnabled = 1
bHorizontal = 0
bShowLabels = 1
bShowValues = 1
bAlignRight = 1
; compact: only pictures and trend arrows; iExpandKey (DirectInput scan code, 60 = F2, 0 = none) opens the detailed panel
bCompact = 1
iExpandKey = 60
fPosX = 0.989453
fPosY = 0.05625
fScale = 1.25
fOpacity = 1
fBackground = 0
fBarWidth = 150
; stage and status pictures, 1.0 - 2.5 times their base size
fIconSize = 1.4
; the dark disc under disease icons (and letters when a picture is missing), 0 = icons without a plate
fIconPlate = 0.75

; every text of the panel and the message panel. sFont: a .ttf/.otf in Data/SKSE/Plugins/Fonts (SKSE Menu Framework
; loads that folder at game start), empty = the game font. fTextWeight: extra boldness 0 - 2 px; fOutline: outline
; thickness 0 - 4 px (0 = soft drop shadow instead); sizes are pixels of 14 px text. sOutlineColor: RRGGBBAA
[Text]
sFont = Rajdhani-SemiBold.ttf
fTextWeight = 0.7
fOutline = 0.3
sOutlineColor = 000000D9

[Trend]
fSensitivity = 1

[Visibility]
bHideInCombat = 0
bHideInScenes = 1
bHideInDialogue = 0
fLinger = 8

; 0 auto (only while it matters), 1 always, 2 never
[Meters]
iWetness = 0
iArousal = 0
iDirt = 0
iWarmth = 0
iHunger = 0
iFatigue = 0
iCycle = 0
iCraving = 0
; SL Survival status (licences, toll, curfew, curses, orgasm fatigue) under the meters; needs SexLab Survival Framework 0.6.0+
iSls = 0
; diseases under the SL Survival status (one icon per disease, Disease Widget definitions); 0 auto = only while ill
iDiseases = 0

; SL Survival's messages in their own panel instead of the game's notifications (SexLab Survival Framework 0.6.0+)
[Messages]
bMessages = 1
fMsgPosX = 0.015781
fMsgPosY = 0.270833
fMsgScale = 1.3
fMsgWidth = 359
fMsgBackground = 0
fMsgSeconds = 10
iMsgLines = 5

; disease icons: bDiseaseColors tints each with its own colour, bDiseaseUnknown shows Disease-type spells without a
; definition (generic icon), bDiseasePulse makes a new disease's ring pulse for 5 s, sDiseaseHide = comma-separated ids
[Diseases]
bDiseaseColors = 1
bDiseaseUnknown = 1
bDiseasePulse = 1
sDiseaseHide =

[General]
iLogLevel = 0
